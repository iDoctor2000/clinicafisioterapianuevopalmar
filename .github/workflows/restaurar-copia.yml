# Restaurar una copia de seguridad (solo a mano). Ver docs/RECUPERACION.md.
#
# ¡Sustituye TODOS los datos de la base de datos de destino por los de la copia!
# Protecciones: hay que escribir RESTAURAR y el destino va en un secreto aparte que solo se
# crea en el momento de recuperar (y se borra después): RESTORE_DB_PASSWORD (contraseña de la
# base de datos, para el mismo proyecto) o RESTORE_DB_URL (dirección completa, proyecto nuevo).
name: Restaurar una copia de seguridad

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Día de la copia a recuperar (AAAA-MM-DD). Vacío = la más reciente.'
        required: false
        default: ''
      confirmar:
        description: 'Escribe RESTAURAR (en mayúsculas). Los datos actuales se sustituirán por los de la copia.'
        required: true
      proyecto_nuevo:
        description: 'Es un proyecto de Supabase NUEVO (cargar también las cuentas de acceso)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  restaurar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Comprobaciones de seguridad
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          RESTORE_DB_URL: ${{ secrets.RESTORE_DB_URL }}
          RESTORE_DB_PASSWORD: ${{ secrets.RESTORE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ "$CONFIRMAR" != "RESTAURAR" ]; then echo "::error::No has escrito RESTAURAR: no se hace nada."; exit 1; fi
          if [ -z "$RESTORE_DB_URL$RESTORE_DB_PASSWORD" ]; then echo "::error::Falta el secreto RESTORE_DB_PASSWORD (o RESTORE_DB_URL) con el destino. Ver docs/RECUPERACION.md."; exit 1; fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "::error::Falta el secreto BACKUP_PASSPHRASE (contraseña de las copias)."; exit 1; fi

      - uses: actions/checkout@v4

      - name: Instalar el cliente de PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Buscar y descargar la copia
        env:
          GH_TOKEN: ${{ github.token }}
          FECHA: ${{ inputs.fecha }}
        run: |
          ID=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                 --jq ".artifacts[] | select(.expired | not) | select(.name | $( [ -n "$FECHA" ] && echo ". == \"copia-seguridad-$FECHA\"" || echo 'startswith("copia-seguridad-")' )) | [.created_at, .id] | @tsv" \
               | sort -r | head -1 | cut -f2)
          if [ -z "$ID" ]; then echo "::error::No hay ninguna copia${FECHA:+ del $FECHA} disponible (se guardan 90 días)."; exit 1; fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > copia.zip
          mkdir -p copia && unzip -q copia.zip -d copia
          ls -l copia

      - name: Restaurar
        env:
          RESTORE_DB_URL: ${{ secrets.RESTORE_DB_URL }}
          RESTORE_DB_PASSWORD: ${{ secrets.RESTORE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          ARCHIVO=$(ls copia/*.tar.gpg | head -1)
          if [ "${{ inputs.proyecto_nuevo }}" = "true" ]; then
            bash scripts/copias/restaurar-copia.sh "$ARCHIVO" --con-usuarios
          else
            bash scripts/copias/restaurar-copia.sh "$ARCHIVO"
          fi
