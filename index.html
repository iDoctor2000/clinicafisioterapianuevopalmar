        // --- DATOS POR DEFECTO ---
        const DEFAULT_CONTENT = {

        const MAP_URL = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3145.897350785168!2d-1.1627!3d37.9315!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd63806295555555%3A0x123456789!2sAv.%20de%20Burgos%2C%2030120%20El%20Palmar%2C%20Murcia!5e0!3m2!1ses!2ses!4v1234567890";
        const DIRECTIONS_URL = "https://www.google.com/maps/dir//Av.+de+Burgos,+30120+El+Palmar,+Murcia";

        const SERVICES_LIST = [

            },
            {

                description: 'Desde traumatismos y esguinces hasta gestos deportivos. Readaptación funcional personalizada para volver a competir al máximo nivel.', 
                icon: Activity,
                img: 'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&q=80&w=800',

            },
            {

                description: 'Gestión integral, rehabilitación y valoración del daño corporal. Recuperación completa asistida sin costes directos para ti.', 
                icon: Car,
                img: 'https://images.unsplash.com/photo-1551601651-2a8555f1a136?auto=format&fit=crop&q=80&w=800',

            },
            {

                description: 'Desde estiramientos hasta quiropraxia avanzada. El poder de las manos para sanar, aliviar tensiones y mejorar la movilidad.', 
                icon: Heart,
                img: 'https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&q=80&w=800',

            },
            { 
                title: 'Fisioterapia Geriátrica', 
                description: 'Tratamiento especializado para personas mayores. Mantenimiento de la movilidad, independencia y calidad de vida.', 
                icon: UserCheck,
                img: 'https://images.unsplash.com/photo-1576765608535-5f04d1e3f289?auto=format&fit=crop&q=80&w=800',
                category: 'Geriátrica'
            }
        ];

        const TESTIMONIALS = [
            { id: 1, name: "María García", rating: 5, text: "Después de mi accidente, el equipo fue fundamental. Su profesionalidad no tiene igual." },
            { id: 2, name: "Juan López", rating: 5, text: "Llevaba años con dolor de espalda. Los especialistas en columna me devolvieron la calidad de vida." },
            { id: 3, name: "Sofía Martínez", rating: 5, text: "El trato humano es excepcional. Se nota la experiencia de José Diego." },
        ];

        // --- FESTIVOS REGION DE MURCIA (2024-2025 aprox) ---
        const MURCIA_HOLIDAYS = [
            '2024-01-01', '2024-01-06', '2024-03-19', '2024-03-28', '2024-03-29', '2024-05-01', '2024-06-09', '2024-08-15', '2024-10-12', '2024-11-01', '2024-12-06', '2024-12-09', '2024-12-25',
            '2025-01-01', '2025-01-06', '2025-03-19', '2025-04-17', '2025-04-18', '2025-05-01', '2025-06-09', '2025-08-15', '2025-10-12', '2025-11-01', '2025-12-06', '2025-12-08', '2025-12-25'
        ];

        // --- CONTEXT ---
        const ContentContext = createContext();

        const ContentProvider = ({ children }) => {
            const [content, setContent] = useState(DEFAULT_CONTENT);
            const [isAdmin, setIsAdmin] = useState(false);
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                let unsubscribe;
                let attempts = 0;
                const maxAttempts = 30;

                const checkFirebase = setInterval(() => {
                    attempts++;
                    
                    if (window.db) {
                        clearInterval(checkFirebase);
                        setIsFirebaseReady(true);
                        
                        unsubscribe = window.onSnapshot(window.doc(window.db, "site_content", "main"), 
                            (docSnap) => {
                                if (docSnap.exists()) {
                                    setContent({ ...DEFAULT_CONTENT, ...docSnap.data() });
                                }
                                setIsLoading(false);
                            }, 
                            (error) => {
                                console.error("Error conectando a BD:", error);
                                loadFromLocal();
                                setIsLoading(false);
                            }
                        );
                    } else if (attempts >= maxAttempts) {
                        clearInterval(checkFirebase);
                        console.log("Firebase no detectado a tiempo, usando local.");
                        loadFromLocal();
                        setIsLoading(false);
                    }
                }, 100);

                const loadFromLocal = () => {
                     const saved = localStorage.getItem('site_content_v1');
                     if (saved) setContent({ ...DEFAULT_CONTENT, ...JSON.parse(saved) });
                };

                return () => {
                    clearInterval(checkFirebase);
                    if (unsubscribe) unsubscribe();
                }
            }, []);

            const updateContent = async (section, key, value) => {
                const newContent = { ...content, [section]: { ...content[section], [key]: value } };
                setContent(newContent); 
                if (window.db) {
                    try { await window.setDoc(window.doc(window.db, "site_content", "main"), newContent); } catch (e) {}
                } else {
                    localStorage.setItem('site_content_v1', JSON.stringify(newContent));
                }
            };

            if (isLoading) {
                return (
                    <div className="fixed inset-0 bg-white z-[9999] flex items-center justify-center transition-opacity duration-500">
                        <div className="w-full h-full flex items-center justify-center p-8">
                             <img 
                                src="assets/ico2026.png" 
                                className="w-full max-w-md object-contain animate-breath" 
                                alt="Cargando..." 
                                onError={(e) => {
                                    e.target.style.display='none';
                                    e.target.parentNode.innerHTML = '<div class="flex flex-col items-center"><div class="w-20 h-20 rounded-full border-4 border-brand-green border-t-transparent animate-spin mb-4"></div><span class="text-2xl font-serif text-brand-dark">Cargando...</span></div>';
                                }}
                            />
                        </div>
                    </div>
                );
            }

            return (
                <ContentContext.Provider value={{ 
                    content, updateContent, isAdmin, 
                    login: (p) => { if(p==="JoseDiego2026"){setIsAdmin(true); return true;} return false; },
                    logout: () => setIsAdmin(false), 
                    resetToDefaults: () => { if(confirm("¿Restaurar?")) { setContent(DEFAULT_CONTENT); if(!window.db) localStorage.removeItem('site_content_v1'); }},
                    isFirebaseReady 
                }}>
                    {children}
                </ContentContext.Provider>
            );
        };
        const useContent = () => useContext(ContentContext);

        // --- UI COMPONENTS ---
        const Reveal = ({ children, className = "", delay = 0 }) => {
            const ref = useRef(null);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target);
                    }
                }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            return <div ref={ref} className={`reveal ${className}`} style={{ transitionDelay: `${delay}ms` }}>{children}</div>;
        };

        const Button = ({ children, variant = 'primary', className = '', ...props }) => {
            const base = "inline-flex items-center justify-center px-8 py-3 text-sm font-medium transition-all duration-300 rounded-full shadow-lg hover:-translate-y-1 disabled:opacity-50 disabled:hover:translate-y-0 disabled:cursor-not-allowed";
            const styles = {
                primary: "bg-brand-green hover:bg-green-700 text-white",
                outline: "border-2 border-brand-green text-brand-green hover:bg-brand-green hover:text-white bg-white/50 backdrop-blur-sm",
                accent: "bg-brand-accent hover:bg-red-600 text-white",
                dark: "bg-brand-dark hover:bg-gray-800 text-white"
            };
            return <button className={`${base} ${styles[variant]} ${className}`} {...props}>{children}</button>;
        };

        // --- BOOKING MODAL ---
        const BookingModal = ({ isOpen, onClose }) => {
            const [step, setStep] = useState(1); // 1: Date, 2: Time, 3: Form, 4: Success
            const [selectedDate, setSelectedDate] = useState(null);
            const [selectedTime, setSelectedTime] = useState(null);
            const [currentMonth, setCurrentMonth] = useState(new Date());
            
            // Form & Validation State
            const [formData, setFormData] = useState({ name: '', phone: '', comments: '' });
            const [touched, setTouched] = useState({ name: false, phone: false });
            const [errors, setErrors] = useState({ name: '', phone: '' });

            if (!isOpen) return null;

            // --- HELPERS ---
            const getDaysInMonth = (date) => new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
            const getFirstDayOfMonth = (date) => {
                let day = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
                return day === 0 ? 6 : day - 1; // Ajuste para que Lunes sea 0
            };

            const isDateDisabled = (day) => {
                const date = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), day);
                const today = new Date();
                today.setHours(0,0,0,0);
                if (date < today) return true;
                if (date.getDay() === 0 || date.getDay() === 6) return true;
                const dateString = date.toISOString().split('T')[0];
                if (MURCIA_HOLIDAYS.includes(dateString)) return true;
                return false;
            };

            // --- VALIDATION LOGIC ---
            const validateField = (name, value) => {
                if (name === 'name') {
                    if (!value.trim()) return "El nombre es obligatorio.";
                    if (value.trim().length < 3) return "El nombre debe tener al menos 3 letras.";
                }
                if (name === 'phone') {
                    if (!value.trim()) return "El teléfono es obligatorio.";
                    // Regex simple para telefonos españoles (fijos 9/8, moviles 6/7)
                    const phoneRegex = /^[6789]\d{8}$/;
                    if (!phoneRegex.test(value.replace(/\s/g, ''))) return "Introduce un teléfono válido (9 dígitos).";
                }
                return "";
            };

            const handleBlur = (e) => {
                const { name, value } = e.target;
                setTouched(prev => ({ ...prev, [name]: true }));
                setErrors(prev => ({ ...prev, [name]: validateField(name, value) }));
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
                // Si ya se ha tocado el campo, validar en tiempo real
                if (touched[name]) {
                    setErrors(prev => ({ ...prev, [name]: validateField(name, value) }));
                }
            };

            const isFormValid = () => {
                const nameErr = validateField('name', formData.name);
                const phoneErr = validateField('phone', formData.phone);
                return !nameErr && !phoneErr && formData.name && formData.phone;
            };

            const handleDateClick = (day) => {
                if (isDateDisabled(day)) return;
                const date = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), day);
                setSelectedDate(date);
                setStep(2);
            };

            const generateTimeSlots = () => {
                const slots = [];
                for (let i = 9; i < 14; i++) slots.push(`${i.toString().padStart(2, '0')}:00`);
                for (let i = 17; i < 21; i++) slots.push(`${i}:00`);
                return slots;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                // Validar todo antes de enviar
                const nameErr = validateField('name', formData.name);
                const phoneErr = validateField('phone', formData.phone);
                
                setTouched({ name: true, phone: true });
                setErrors({ name: nameErr, phone: phoneErr });

                if (nameErr || phoneErr) return;

                // Submit simulado
                setTimeout(() => setStep(4), 1000);
            };

            const renderCalendar = () => {
                const daysInMonth = getDaysInMonth(currentMonth);
                const firstDay = getFirstDayOfMonth(currentMonth);
                const days = [];
                const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

                for (let i = 0; i < firstDay; i++) days.push(<div key={`empty-${i}`} />);
                for (let i = 1; i <= daysInMonth; i++) {
                    const disabled = isDateDisabled(i);
                    const isSelected = selectedDate && selectedDate.getDate() === i && selectedDate.getMonth() === currentMonth.getMonth();
                    days.push(
                        <button 
                            key={i} 
                            disabled={disabled}
                            onClick={() => handleDateClick(i)}
                            className={`
                                h-10 w-10 rounded-full flex items-center justify-center text-sm font-medium transition-all
                                ${isSelected ? 'bg-brand-green text-white shadow-lg scale-110' : ''}
                                ${disabled ? 'text-gray-300 cursor-not-allowed' : 'hover:bg-brand-green/20 text-brand-dark'}
                            `}
                        >
                            {i}
                        </button>
                    );
                }

                return (
                    <div className="animate-fade-in">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-xl font-serif font-bold text-brand-dark">{monthNames[currentMonth.getMonth()]} {currentMonth.getFullYear()}</h3>
                            <div className="flex gap-2">
                                <button onClick={() => setCurrentMonth(new Date(currentMonth.setMonth(currentMonth.getMonth() - 1)))} className="p-2 hover:bg-gray-100 rounded-full"><ChevronLeft/></button>
                                <button onClick={() => setCurrentMonth(new Date(currentMonth.setMonth(currentMonth.getMonth() + 1)))} className="p-2 hover:bg-gray-100 rounded-full"><ChevronRight/></button>
                            </div>
                        </div>
                        <div className="grid grid-cols-7 gap-1 text-center mb-2">
                            {['L','M','X','J','V','S','D'].map(d => <span key={d} className="text-xs font-bold text-gray-400">{d}</span>)}
                        </div>
                        <div className="grid grid-cols-7 gap-1 place-items-center">
                            {days}
                        </div>
                    </div>
                );
            };

            return (
                <div className="fixed inset-0 z-[80] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col max-h-[90vh]" onClick={e => e.stopPropagation()}>
                        <div className="bg-brand-dark p-6 flex justify-between items-center text-white">
                            <h2 className="text-xl font-bold flex items-center gap-2">
                                <CalendarIcon size={20} className="text-brand-green" /> Reserva Online
                            </h2>
                            <button onClick={onClose} className="hover:text-brand-green transition-colors"><X/></button>
                        </div>
                        
                        <div className="p-8 overflow-y-auto custom-scrollbar">
                            {step === 1 && renderCalendar()}
                            
                            {step === 2 && (
                                <div className="animate-fade-in">
                                    <button onClick={() => setStep(1)} className="text-sm text-gray-500 mb-4 hover:text-brand-dark flex items-center gap-1"><ChevronLeft size={16}/> Volver al calendario</button>
                                    
                                    {/* RESUMEN FECHA SELECCIONADA */}
                                    <div className="bg-brand-light/50 p-4 rounded-xl mb-6 flex items-center gap-3 border border-brand-green/10">
                                        <CalendarIcon className="text-brand-green shrink-0" size={20} />
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase font-bold tracking-wider">Fecha seleccionada</p>
                                            <p className="text-brand-dark font-medium capitalize">
                                                {selectedDate?.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                                            </p>
                                        </div>
                                    </div>

                                    <h3 className="text-xl font-serif font-bold mb-4">Turnos Disponibles</h3>
                                    <div className="grid grid-cols-3 sm:grid-cols-4 gap-3">
                                        {generateTimeSlots().map(time => (
                                            <button 
                                                key={time} 
                                                onClick={() => { setSelectedTime(time); setStep(3); }}
                                                className="py-2 px-4 rounded-lg border border-gray-200 hover:border-brand-green hover:bg-brand-green/5 hover:text-brand-green transition-all"
                                            >
                                                {time}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 3 && (
                                <form onSubmit={handleSubmit} className="animate-fade-in space-y-5">
                                    <button type="button" onClick={() => setStep(2)} className="text-sm text-gray-500 mb-2 hover:text-brand-dark flex items-center gap-1"><ChevronLeft size={16}/> Volver a horas</button>
                                    
                                    {/* RESUMEN COMPLETO INTERACTIVO */}

                    <section className="relative h-[60vh] bg-fixed bg-center bg-cover flex items-center justify-center" style={{ backgroundImage: "url('assets/interior.png')" }} aria-label="Instalaciones">
                        <div className="absolute inset-0 bg-black/40"></div>
                        <div className="relative text-center text-white p-4">
                            <Reveal><h2 className="font-serif text-4xl md:text-5xl mb-4">Instalaciones de Vanguardia</h2><p className="text-xl opacity-90">Un espacio diseñado para tu recuperación.</p></Reveal>
                        </div>
                    </section>

                    {/* PILATES */}
                    <section id="pilates" className="py-24 relative overflow-hidden bg-brand-dark">
                        <div className="absolute inset-0 opacity-10 mix-blend-overlay"><img src="assets/Cara abstracta.jpeg" alt="Decoración" className="w-full h-full object-cover grayscale" /></div>
                        <div className="max-w-7xl mx-auto px-4 relative z-10 grid lg:grid-cols-12 gap-12">
                            <div className="lg:col-span-5 text-white">
                                <Reveal>
                                    <h2 className="text-brand-green font-bold uppercase mb-2">Escuela de Salud</h2>
                                    <h3 className="font-serif text-4xl mb-6">{content.pilates.title}</h3>
                                    <p className="text-gray-300 text-lg mb-8">{content.pilates.description}</p>
                                    <div className="bg-white/10 backdrop-blur rounded-2xl p-6 mb-8 border border-white/10">
                                        <div className="flex items-center gap-3 mb-2 font-bold text-lg"><Star className="text-brand-green fill-current"/> Evaluación Inicial</div>
                                        <p className="text-gray-400 text-sm">Valoración funcional completa antes de comenzar.</p>
                                    </div>
                                    <div className="flex flex-col sm:flex-row gap-4">
                                        <a href={`mailto:${content.contact.email}?subject=Reserva Clase`}><Button variant="accent">Clase de Prueba</Button></a>
                                        <Button variant="primary" onClick={() => setIsBookingModalOpen(true)}>Reservar Online</Button>
                                    </div>
                                </Reveal>
                            </div>
                            <div className="lg:col-span-7 grid md:grid-cols-3 gap-6">
                                {[
                                    { t: "Individual", p: content.pilates.priceIndividual, f: ["100% Personalizado", "Máquinas y Suelo"] },
                                    { t: "Pareja", p: content.pilates.pricePair, f: ["Semi-privado", "Motivación conjunta"], rec: true },
                                    { t: "Grupos", p: content.pilates.priceGroup, f: ["Máximo 4 personas", "Ambiente dinámico"] }
                                ].map((plan, i) => (
                                    <Reveal key={i} delay={i*150} className="h-full">
                                        <div className={`rounded-2xl p-6 h-full flex flex-col ${plan.rec ? 'bg-white text-brand-dark shadow-2xl scale-105 z-10' : 'bg-white/5 border border-white/10 text-white'}`}>
                                            {plan.rec && <span className="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-brand-green text-white px-3 py-1 text-xs font-bold rounded-full uppercase">Recomendado</span>}
                                            <h4 className="font-bold text-lg mb-2">{plan.t}</h4>
                                            <div className="text-2xl font-serif font-bold mb-6">{plan.p}</div>
                                            <ul className="space-y-3 mb-8 flex-1">
                                                {plan.f.map(f => <li key={f} className="flex gap-2 text-sm opacity-80"><Check size={16} className={plan.rec ? 'text-brand-green' : ''}/> {f}</li>)}
                                            </ul>
                                            <a href={`https://wa.me/34${content.contact.phone.replace(/\s/g, '')}`} className={`w-full py-2 rounded-lg text-center text-sm font-bold ${plan.rec ? 'bg-brand-dark text-white' : 'bg-white/10 hover:bg-white/20'}`}>Más Info</a>
                                        </div>
                                    </Reveal>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* BLOG */}
                    <section id="blog" className="py-24 bg-white">
                        <div className="max-w-7xl mx-auto px-4">
                            <Reveal><h2 className="text-center font-serif text-4xl text-brand-dark mb-12">Blog y Consejos</h2></Reveal>
                            <div className="grid md:grid-cols-3 gap-8">
                                {[1,2,3].map(i => (
                                    <Reveal key={i} delay={i*100}>
                                        <article className="group cursor-pointer">
                                            <div className="aspect-video rounded-2xl bg-gray-100 overflow-hidden mb-4"><img src={`https://picsum.photos/400/300?random=${i}`} alt={`Articulo ${i}`} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/></div>
                                            <h4 className="font-bold text-lg mb-2 group-hover:text-brand-green transition-colors">Artículo de Salud {i}</h4>
                                            <p className="text-gray-600 text-sm">Consejos prácticos para mejorar tu bienestar diario y prevenir lesiones.</p>
                                        </article>
                                    </Reveal>
                                ))}
                            </div>
                        </div>
                    </section>

                    <Testimonials />

                    {/* CONTACT */}
                    <section id="contact" className="py-24 bg-brand-light">
                        <div className="max-w-7xl mx-auto px-4">
                            <Reveal>
                                <div className="bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col lg:flex-row">
                                    <div className="lg:w-1/3 p-10 bg-brand-dark text-white">
                                        <h3 className="font-serif text-3xl mb-8">Contacto</h3>
                                        <div className="space-y-6">
                                            <div className="flex gap-4"><MapPin className="text-brand-green shrink-0"/> <div><p className="font-bold">Ubicación</p><p className="text-gray-400 text-sm">{content.contact.address}<br/>{content.contact.city}</p></div></div>
                                            <div className="flex gap-4"><Phone className="text-brand-green shrink-0"/> <div><p className="font-bold">Llámanos</p><p className="text-gray-400 text-sm">{content.contact.phone}</p></div></div>
                                            <div className="flex gap-4"><Mail className="text-brand-green shrink-0"/> <div><p className="font-bold">Escríbenos</p><p className="text-gray-400 text-sm break-all">{content.contact.email}</p></div></div>
                                        </div>
                                    </div>
                                    <div className="lg:w-2/3 min-h-[400px] relative group">
                                        <iframe src={MAP_URL} className="absolute inset-0 w-full h-full border-0 grayscale group-hover:grayscale-0 transition-all duration-700" allowFullScreen loading="lazy"></iframe>
                                        <div className="absolute bottom-6 right-6 flex flex-col sm:flex-row gap-3 z-10">
                                            <button onClick={() => setIsMapModalOpen(true)} className="bg-white text-brand-dark px-5 py-2.5 rounded-xl shadow-lg font-bold text-sm flex items-center gap-2 hover:bg-brand-green hover:text-white transition-all transform hover:scale-105 border border-gray-100"><Maximize2 size={18} /> Ampliar Mapa</button>
                                            <a href={DIRECTIONS_URL} target="_blank" rel="noreferrer" className="bg-brand-green text-white px-5 py-2.5 rounded-xl shadow-lg font-bold text-sm flex items-center gap-2 hover:bg-green-700 transition-all transform hover:scale-105"><ExternalLink size={18} /> Cómo llegar</a>
                                        </div>
                                    </div>
                                </div>
                            </Reveal>
                        </div>
                    </section>
                    
                    <footer className="bg-brand-dark text-white py-8 text-center text-sm border-t border-white/10"><p>&copy; 2026 Clínica Nuevo Palmar. Diseño Estrategia Digital.</p></footer>
                    <MapModal isOpen={isMapModalOpen} onClose={() => setIsMapModalOpen(false)} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<ContentProvider><App /></ContentProvider>);
    </script>
</body>
</html>
