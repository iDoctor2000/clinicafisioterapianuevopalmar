        window.subirImagenWeb = async (blob, nombre) => {
            if (!supabase) throw new Error("Sin conexión con la nube");
            const ruta = `${Date.now()}-${nombre}`;
            const { error } = await supabase.storage.from('web').upload(ruta, blob, { contentType: blob.type || 'image/jpeg', cacheControl: '31536000', upsert: false });
            if (error) { const err = new Error(error.message); err.code = /row-level|policy|permission|unauthorized|403/i.test(error.message) ? 'unauthorized' : (error.statusCode || ''); throw err; }
            return supabase.storage.from('web').getPublicUrl(ruta).data.publicUrl;

        const mergeContent = (saved) => {

            const out = { ...DEFAULT_CONTENT };
            for (const [section, def] of Object.entries(DEFAULT_CONTENT)) {
                if (section === 'schema') continue;
                const s = saved[section];
                if (!s || typeof s !== 'object') continue;
                const merged = { ...def };
                for (const [k, dv] of Object.entries(def)) {
                    const sv = s[k];
                    if (typeof dv === 'string' && typeof sv === 'string') merged[k] = sv;
                    else if (Array.isArray(dv) && Array.isArray(sv)) merged[k] = sv;

                let activo = true;

                    try {
                        const { data, error } = await supabase.from('web_contenido').select('datos').eq('id', 'main').maybeSingle();

                        if (error) throw error;
                        setIsCloudReady(true);
                        if (data && data.datos) { setContent(mergeContent(data.datos)); setHasCloudContent(true); }
                        else loadFromLocal();
                    } catch (err) {
                        console.error("Error leyendo el contenido de la nube:", err);
                        loadFromLocal();
                    } finally { if (activo) setIsLoading(false); }
                })();
                const canal = supabase.channel('web_contenido')

                        if (payload.new && payload.new.datos) { setContent(mergeContent(payload.new.datos)); setHasCloudContent(true); }
                    })
                    .subscribe();
                return () => { activo = false; supabase.removeChannel(canal); };
            }, []);

            // Sesión ya iniciada (misma cuenta que la app de Pilates): comprobar si es administrador.
            const comprobarAdmin = useCallback(async (user) => {
                if (!supabase || !user) { setIsAdmin(false); setAdminUser(null); return false; }
                const { data, error } = await supabase.rpc('es_admin');
                if (error) { console.error("No se ha podido comprobar el rol:", error); setIsAdmin(false); setAdminUser(null); return false; }
                setIsAdmin(!!data); setAdminUser(data ? user : null);
                return !!data;
            }, []);
            useEffect(() => {
                if (!supabase) return;
                supabase.auth.getSession().then(({ data }) => { if (data && data.session) comprobarAdmin(data.session.user); });
                const { data: sub } = supabase.auth.onAuthStateChange((evento, sesion) => {
                    if (evento === 'SIGNED_OUT') { setIsAdmin(false); setAdminUser(null); }
                    else if (sesion && sesion.user) comprobarAdmin(sesion.user);
                });
                return () => sub.subscription.unsubscribe();
            }, [comprobarAdmin]);

            const persist = useCallback((next) => {
                pending.current = next;
                clearTimeout(saveTimer.current);
                setSaveState('saving'); setSaveError('');
                saveTimer.current = setTimeout(async () => {
                    const data = pending.current;
                    try {
                        try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch (_) {}
                        if (supabase) {
                            const { data: sesion } = await supabase.auth.getSession();
                            const uid = sesion && sesion.session ? sesion.session.user.id : null;
                            const { error } = await supabase.from('web_contenido').upsert({ id: 'main', datos: data, actualizado_por: uid });
                            if (error) throw error;
                            setHasCloudContent(true);
                        }
                        setSaveState('saved');
                    } catch (e) {
                        console.error("Error guardando en la nube:", e);
                        const msg = e && e.message ? e.message : String(e);
                        setSaveError(/row-level|policy|permission|401|403/i.test(msg) ? 'Tu usuario no tiene permiso para guardar (solo administradores).' : msg);
                        setSaveState('error');
                    }
                }, 700);
            }, []);

            const updateField = useCallback((section, key, value) => {
                setContent(prev => {
                    const next = { ...prev, schema: SCHEMA_VERSION, [section]: { ...prev[section], [key]: value } };
                    persist(next);
                    return next;
                });
            }, [persist]);

            const resetToDefaults = useCallback(() => {
                if (!confirm("¿Restaurar todos los textos e imágenes por defecto? Se perderán los cambios guardados.")) return;
                const next = cloneDefaults();
                setContent(next);
                persist(next);
            }, [persist]);

            // Trae los textos de la versión anterior (Firebase) y los guarda en la nube nueva.
            const importarAntiguo = useCallback(async () => {
                const viejo = await leerContenidoFirebase();
                if (!viejo) throw new Error("No hay textos guardados en la versión anterior.");
                const next = mergeContent(viejo);
                if (next === DEFAULT_CONTENT) throw new Error("Los textos antiguos tienen otro formato y no se pueden importar.");
                setContent(next);
                persist(next);
            }, [persist]);

            // Entrar con Google: Supabase redirige a Google y vuelve a esta misma página; al volver, el
            // editor se abre solo (marca en sessionStorage) y se comprueba que el usuario es administrador.
            const [reabrirEditor, setReabrirEditor] = useState(false);
            const [googleError, setGoogleError] = useState("");
            useEffect(() => {
                if (sessionStorage.getItem('np_editor_google') !== '1') return;
                if (!supabase) return;
                let intentos = 0;
                const t = setInterval(async () => {
                    intentos++;
                    const { data } = await supabase.auth.getSession();
                    if (data && data.session) {
                        clearInterval(t); sessionStorage.removeItem('np_editor_google');
                        const admin = await comprobarAdmin(data.session.user);
                        if (!admin) { await supabase.auth.signOut(); setGoogleError("Tu cuenta de Google no es la de un administrador del centro. Solo los administradores pueden editar la web."); }
                        setReabrirEditor(true);
                    } else if (intentos > 40) { clearInterval(t); sessionStorage.removeItem('np_editor_google'); setGoogleError("No se ha completado el acceso con Google. Vuelve a intentarlo."); setReabrirEditor(true); }
                }, 250);
                return () => clearInterval(t);
            }, [comprobarAdmin]);
            const loginGoogle = useCallback(async () => {
                if (!supabase) return { ok: false, error: "Sin conexión con la nube." };
                sessionStorage.setItem('np_editor_google', '1');
                const volverA = location.origin + location.pathname;
                const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: volverA, queryParams: { prompt: 'select_account' } } });
                if (error) { sessionStorage.removeItem('np_editor_google'); return { ok: false, error: error.message }; }
                return { ok: true };
            }, []);

            const login = useCallback(async (email, password) => {
                if (!supabase) return { ok: false, error: "Sin conexión con la nube." };
                const { data, error } = await supabase.auth.signInWithPassword({ email: email.trim(), password });
                if (error) return { ok: false, error: /invalid login/i.test(error.message) ? "Correo o contraseña incorrectos." : /email not confirmed/i.test(error.message) ? "Tu correo aún no está confirmado: revisa tu bandeja de entrada." : error.message };
                const admin = await comprobarAdmin(data.user);
                if (!admin) { await supabase.auth.signOut(); return { ok: false, error: "Tu usuario no es administrador del centro. Solo los administradores pueden editar la web." }; }
                return { ok: true };
            }, [comprobarAdmin]);

            const logout = useCallback(async () => {
                if (supabase) await supabase.auth.signOut();
                setIsAdmin(false); setAdminUser(null);
            }, []);

            const value = useMemo(() => ({
                content, updateField, resetToDefaults, importarAntiguo, isAdmin, adminUser, isCloudReady, hasCloudContent, saveState, saveError, login, loginGoogle, googleError, logout,
                reabrirEditor, consumirReapertura: () => setReabrirEditor(false),
            }), [content, updateField, resetToDefaults, importarAntiguo, isAdmin, adminUser, isCloudReady, hasCloudContent, saveState, saveError, login, loginGoogle, googleError, logout, reabrirEditor]);

            // Pantalla de arranque: el logotipo aparece en fundido, se mantiene un instante y se desvanece
            // cuando el contenido está listo (mínimo 1,4 s para que la entrada luzca).
            const [splashMin, setSplashMin] = useState(true);
            const [splashMounted, setSplashMounted] = useState(true);
            useEffect(() => { const t = setTimeout(() => setSplashMin(false), 1400); return () => clearTimeout(t); }, []);
            const splashOut = !isLoading && !splashMin;
            useEffect(() => {
                if (!splashOut) return;
                const t = setTimeout(() => setSplashMounted(false), 900);
                return () => clearTimeout(t);
            }, [splashOut]);

            return (
                <ContentContext.Provider value={value}>
                    {!isLoading && children}
                    {splashMounted && (
                        <div className={`fixed inset-0 bg-white z-[9999] flex items-center justify-center transition-opacity duration-[900ms] ease-out ${splashOut ? 'opacity-0 pointer-events-none' : 'opacity-100'}`} aria-busy={isLoading} aria-label="Cargando">
                            <img src="assets/logo-clinica.png" alt="Clínica de Fisioterapia Nuevo Palmar" className={`w-56 md:w-80 object-contain splash-logo ${splashOut ? 'splash-logo-out' : ''}`} />
                        </div>
                    )}
                </ContentContext.Provider>
            );
        };

        // ------------------------------------------------------------------
        // PIEZAS DE INTERFAZ
        // ------------------------------------------------------------------
        const Reveal = ({ children, className = "", delay = 0, as: Tag = 'div' }) => {
            const ref = useRef(null);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                if (!('IntersectionObserver' in window)) { el.classList.add('active'); return; }
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { entry.target.classList.add('active'); observer.unobserve(entry.target); }
                }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
                observer.observe(el);
                return () => observer.disconnect();
            }, []);
            return <Tag ref={ref} className={`reveal ${className}`} style={{ transitionDelay: `${delay}ms` }}>{children}</Tag>;
        };

            useEffect(() => {

            return (

            return (

                    <section id="quienes-somos" className="py-20 md:py-28 lg:py-36 bg-white">

                        <div className="relative max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">

            const [offset, setOffset] = useState(0);
            const drag = useRef({ x: 0, dx: 0, active: false, id: null });
            const reduced = useMemo(() => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches, []);

            const go = useCallback((i) => setIndex(((i % n) + n) % n), [n]);
            useEffect(() => { if (index >= n) setIndex(0); }, [n, index]);
            useEffect(() => {
                if (paused || stopped || reduced || n < 2) return;
                const t = setInterval(() => setIndex(i => (i + 1) % n), 6000);
                return () => clearInterval(t);
            }, [paused, stopped, reduced, n]);

            const onPointerDown = (e) => { drag.current = { x: e.clientX, dx: 0, active: true, id: e.pointerId }; setStopped(true); };
            const onPointerMove = (e) => { if (!drag.current.active) return; drag.current.dx = e.clientX - drag.current.x; setOffset(drag.current.dx); };
            const endDrag = () => {
                if (!drag.current.active) return;
                const dx = drag.current.dx; drag.current.active = false; setOffset(0);
                if (Math.abs(dx) > 48) go(index + (dx < 0 ? 1 : -1));
            };
            const onKey = (e) => {
                if (e.key === 'ArrowRight') { e.preventDefault(); setStopped(true); go(index + 1); }
                if (e.key === 'ArrowLeft') { e.preventDefault(); setStopped(true); go(index - 1); }
            };
            if (!n) return null;
            const current = images[index] || images[0];
            return (
                <div className="relative" role="region" aria-roledescription="carrusel" aria-label={label} onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)} onFocus={() => setPaused(true)} onBlur={() => setPaused(false)}>

                        <div className="carousel-track flex h-full" style={{ transform: `translateX(calc(${-index * 100}% + ${offset}px))`, transition: offset ? 'none' : 'transform .8s cubic-bezier(.22,.61,.36,1)' }}>

                                <div key={i} className="w-full h-full shrink-0" role="group" aria-roledescription="diapositiva" aria-label={`${i + 1} de ${n}`} aria-hidden={i !== index}>
                                    <Img src={im.src} alt={im.caption || `Instalaciones ${i + 1}`} className="w-full h-full object-cover" />
                                </div>
                            ))}
                        </div>
                    </div>

                    {n > 1 && (
                        <>
                            <button onClick={() => { setStopped(true); go(index - 1); }} className="absolute left-3 md:-left-7 top-[calc(50%-2rem)] md:top-1/2 -translate-y-1/2 w-12 h-12 md:w-14 md:h-14 rounded-full bg-white/95 border border-sand-light text-ink shadow-lg flex items-center justify-center hover:bg-ink hover:text-white transition-colors" aria-label="Imagen anterior"><ChevronLeft size={26} strokeWidth={1.5} /></button>
                            <button onClick={() => { setStopped(true); go(index + 1); }} className="absolute right-3 md:-right-7 top-[calc(50%-2rem)] md:top-1/2 -translate-y-1/2 w-12 h-12 md:w-14 md:h-14 rounded-full bg-white/95 border border-sand-light text-ink shadow-lg flex items-center justify-center hover:bg-ink hover:text-white transition-colors" aria-label="Imagen siguiente"><ChevronRight size={26} strokeWidth={1.5} /></button>

        );

        // Reduce una foto en el propio navegador (máx. 1600 px de ancho, JPEG) antes de subirla.
        const reducirFoto = (file) => new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                URL.revokeObjectURL(url);
                const MAX = 1600;
                const k = Math.min(1, MAX / Math.max(img.width, img.height));
                const c = document.createElement('canvas');
                c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                c.toBlob(b => b ? resolve(b) : reject(new Error('No se ha podido procesar la imagen')), 'image/jpeg', 0.84);
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('El archivo no es una imagen válida')); };
            img.src = url;
        });

                const file = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!file) return;
                if (!window.subirImagenWeb) { setError('La subida de fotos no está disponible (sin conexión con la nube).'); return; }
                setSubiendo(true); setError('');
                try {
                    const blob = await reducirFoto(file);
                    const base = (file.name || 'foto').replace(/\.[^.]+$/, '').replace(/[^a-z0-9_-]+/gi, '-').toLowerCase().slice(0, 40) || 'foto';
                    const url = await window.subirImagenWeb(blob, `${base}.jpg`);
                    onChange(url);
                } catch (err) {

                    const code = err && err.code ? String(err.code) : '';
                    setError(code.includes('unauthorized') || code.includes('permission')

        const normalizeLines = (t) => t.split('\n').map(s => s.trim()).filter(Boolean);
        const LinesField = ({ value, onChange, rows = 5 }) => {
            const [text, setText] = useState((value || []).join('\n'));
            // Solo se sincroniza desde fuera (p. ej. al restaurar) si el contenido real difiere de lo escrito
            useEffect(() => { const incoming = (value || []).join('\n'); if (incoming !== normalizeLines(text).join('\n')) setText(incoming); }, [value]);
            return <textarea value={text} rows={rows} onChange={e => { setText(e.target.value); onChange(normalizeLines(e.target.value)); }} className={inputCls} />;
        };

        const IconSelect = ({ value, onChange }) => (

            remove: (i) => { if (!confirm("¿Eliminar este elemento?")) return; onChange(items.filter((_, k) => k !== i)); },
            update: (i, patch) => onChange(items.map((it, k) => k === i ? { ...it, ...patch } : it)),

            let control;
            switch (field.t) {

        const AdminPanel = ({ isOpen, onClose }) => {

                                <button type="button" disabled={googleLoading} onClick={async () => { setGoogleLoading(true); setLoginError(""); const r = await loginGoogle(); if (!r.ok) { setLoginError(r.error); setGoogleLoading(false); } }}
                                    className="inline-flex items-center justify-center gap-3 w-full max-w-xs mx-auto px-5 py-3 rounded-full border border-sand text-ink text-sm font-medium hover:bg-sand-ivory disabled:opacity-60 transition">
                                    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.8 6C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.2 5.5-4.7 7.2l7.4 5.7c4.3-4 7.1-9.9 7.1-16.9z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.9 2.3-8.5 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6C6.5 42.6 14.6 48 24 48z"/></svg>
                                    {googleLoading ? 'Abriendo Google…' : 'Entrar con Google'}
                                </button>
                                <p className="text-xs text-ink-soft font-light mt-6">Usa la misma cuenta de Google que en la app de Pilates. Si prefieres contraseña y no la tienes, créala en la app con <em>"Crear mi contraseña"</em>.</p>
                            </form>
                        ) : (
                            <>
                                <div className="px-6 pt-4 border-b border-sand-light">
                                    <div className="flex gap-2 overflow-x-auto pb-3 custom-scrollbar" role="tablist" aria-label="Secciones">
                                        {ADMIN_TABS.map(t => (
                                            <button key={t.id} role="tab" aria-selected={tab === t.id} onClick={() => setTab(t.id)} className={`px-3.5 py-1.5 rounded-full text-xs whitespace-nowrap transition-colors ${tab === t.id ? 'bg-ink text-white' : 'bg-sand-ivory text-ink hover:bg-sand-light'}`}>{t.label}</button>
                                        ))}
                                    </div>
                                </div>
                                <div className="p-6 overflow-y-auto flex-1 custom-scrollbar space-y-5">
                                    {!hasCloudContent && isCloudReady && (
                                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 bg-sand-ivory rounded-2xl border border-sand-light">
                                            <div className="text-sm"><p className="font-medium text-ink">Todavía no hay textos guardados en la nube nueva</p><p className="text-ink-soft font-light">Si cambiaste textos o fotos en la versión anterior de la web, impórtalos aquí una sola vez. Si no, no hace falta: se muestran los textos por defecto.</p>{importMsg && <p className="mt-1 text-ink">{importMsg}</p>}</div>
                                            <SmallBtn onClick={importar} disabled={importando}>{importando ? 'Importando…' : 'Importar de la versión anterior'}</SmallBtn>
                                        </div>
                                    )}
                                    {current.fields.map(f => <Field key={f.k} section={current.id} field={f} />)}
                                </div>
                                <div className="px-6 py-4 border-t border-sand-light flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-sand-ivory/50">
                                    <div className="min-w-0">
                                        <span className={`text-xs ${saveState === 'error' ? 'text-red-700' : 'text-ink-soft'}`} aria-live="polite">{saveLabel}</span>
                                        {adminUser && <span className="block text-[11px] text-ink-soft font-light truncate">Sesión: {adminUser.email}</span>}
                                    </div>
                                    <div className="flex gap-2 flex-wrap">
                                        <SmallBtn onClick={resetToDefaults} className="text-red-700 border-red-100 hover:bg-red-50"><RotateCcw size={14} /> Restaurar textos por defecto</SmallBtn>
                                        <SmallBtn onClick={onClose}>Cerrar</SmallBtn>
                                        <SmallBtn onClick={() => { logout(); onClose(); }} className="bg-ink text-white border-ink hover:bg-ink-deep" title="Cierra también la sesión de la app de Pilates en este navegador"><LogOut size={14} /> Cerrar sesión</SmallBtn>
                                    </div>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // ------------------------------------------------------------------
        // APLICACIÓN
        // ------------------------------------------------------------------
        const App = () => {
            const [citaOpen, setCitaOpen] = useState(false);
            const [adminOpen, setAdminOpen] = useState(false);
            const openCita = useCallback(() => setCitaOpen(true), []);
            const closeCita = useCallback(() => setCitaOpen(false), []);
            const closeAdmin = useCallback(() => setAdminOpen(false), []);
            const { reabrirEditor, consumirReapertura } = useContent();
            useEffect(() => { if (reabrirEditor) { setAdminOpen(true); consumirReapertura(); } }, [reabrirEditor, consumirReapertura]);

            useEffect(() => {
                if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
                if (!location.hash) window.scrollTo(0, 0);
            }, []);

            return (
                <>
                    <a href="#inicio" className="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[200] focus:bg-ink focus:text-white focus:px-4 focus:py-2 focus:rounded-full">Saltar al contenido</a>
                    <Header onCita={openCita} />
                    <main>
                        <Hero onCita={openCita} />
                        <About />
                        <Specialties />
                        <Spine onCita={openCita} />
                        <Accidents onCita={openCita} />
                        <Pilates />
                        <Facilities />
                        <WhyUs />
                        <Commitment />
                        <Contact />
                    </main>
                    <Footer onAdmin={() => setAdminOpen(true)} />
                    <CitaModal isOpen={citaOpen} onClose={closeCita} />
                    <AdminPanel isOpen={adminOpen} onClose={closeAdmin} />
                </>
            );
        };

        createRoot(document.getElementById('root')).render(<ContentProvider><App /></ContentProvider>);
    </script>
</body>
</html>
