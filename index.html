<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Nuevo Palmar | Fisioterapia & Pilates</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    
    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              stone: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                800: '#292524',
                900: '#1c1917',
              },
              brand: {
                green: '#548C2F',
                dark: '#1c1917', // Casi negro para contraste alto
                soft: '#E8E8E6'  // Un gris cálido para fondos de secciones
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            animation: {
              'fade-up': 'fadeUp 0.8s ease-out forwards',
              'scale-in': 'scaleIn 0.3s ease-out',

            keyframes: {
              fadeUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },

              scaleIn: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>

    <!-- FUENTES -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- BABEL -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- IMPORT MAP -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <style>
        body { background-color: #FAFAF9; color: #1c1917; }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        
        /* Ocultar scrollbar en elementos horizontales pero permitir scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- FIREBASE SETUP -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            // apiKey: "TU_API_KEY_AQUI",
        };

        if (firebaseConfig.apiKey) {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.doc = doc;
            window.onSnapshot = onSnapshot;
            window.setDoc = setDoc;
        }
    </script>

    <!-- REACT APPLICATION CODE -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, createContext, useContext, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Phone, MapPin, Mail, ArrowRight, Check, Star, 
            ArrowUpRight, Activity, Menu, X, Settings, Lock, RotateCcw, LogOut,
            Bone, Heart, UserCheck, Image as ImageIcon, Maximize2
        } from 'lucide-react';

        // --- DATA ---
        const DEFAULT_CONTENT = {
            hero: {
                badge: "Estrategia Digital 2026",
                titleLine1: "Bienestar",
                titleLine2: "Integral",
                description: "25 años de fisioterapia honesta y pilates terapéutico en El Palmar. Un espacio donde la ciencia se encuentra con el trato humano.",
                buttonPrimary: "Reservar Cita",
            },
            contact: {
                phone: "968 885 931",
                address: "Avenida de Burgos s/n",
                city: "El Palmar, Murcia",
                email: "info@fisioterapianuevopalmar.com"
            },
            pilates: {
                title: "Control & Movimiento",
                description: "Rehabilitación activa supervisada por expertos. Recupera tu funcionalidad a través del movimiento consciente.",
                priceIndividual: "Consultar",
                pricePair: "Consultar",
                priceGroup: "Consultar"
            }
        };

        const SERVICES_LIST = [
            { title: 'Osteopatía', desc: 'Restauración del equilibrio estructural visceral y craneal.', icon: Bone },
            { title: 'Punción Seca', desc: 'Tratamiento invasivo de puntos gatillo miofasciales.', icon: Activity },
            { title: 'Deportiva', desc: 'Readaptación al gesto deportivo y tratamiento de lesiones.', icon: Activity },
            { title: 'Tráfico', desc: 'Gestión integral y rehabilitación de accidentes.', icon: Activity },
            { title: 'Terapia Manual', desc: 'Quiropraxia y movilización tejido blando.', icon: Heart },
            { title: 'Geriatría', desc: 'Mantenimiento de la funcionalidad en el adulto mayor.', icon: UserCheck }
        ];

        const GALLERY_ITEMS = [
            { id: 1, title: 'Cabina Principal', category: 'Espacios', img: 'https://images.unsplash.com/photo-1628177142898-7136c2e96d22?auto=format&fit=crop&q=80&w=800' },
            { id: 2, title: 'Terapia Manual', category: 'Fisioterapia', img: 'https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&q=80&w=800' },
            { id: 3, title: 'Estudio Pilates', category: 'Pilates', img: 'https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&q=80&w=800' },
        ];

        // --- CONTEXT ---
        const ContentContext = createContext();
        const ContentProvider = ({ children }) => {
            const [content, setContent] = useState(DEFAULT_CONTENT);
            const [isAdmin, setIsAdmin] = useState(false);

            useEffect(() => {
                const saved = localStorage.getItem('site_content_minimal');
                if (saved) setContent({ ...DEFAULT_CONTENT, ...JSON.parse(saved) });
                
                // Intentar conectar Firebase si existe
                if (window.db) {
                     window.onSnapshot(window.doc(window.db, "site_content", "minimal"), (doc) => {
                        if (doc.exists()) setContent({ ...DEFAULT_CONTENT, ...doc.data() });
                    });
                }
            }, []);

            const updateContent = (section, key, value) => {
                const newContent = { ...content, [section]: { ...content[section], [key]: value } };
                setContent(newContent);
                localStorage.setItem('site_content_minimal', JSON.stringify(newContent));
                if (window.db) window.setDoc(window.doc(window.db, "site_content", "minimal"), newContent);
            };

            return (
                <ContentContext.Provider value={{ 
                    content, updateContent, isAdmin, 
                    login: (p) => { if(p==="JoseDiego2026"){setIsAdmin(true); return true;} return false; },
                    logout: () => setIsAdmin(false),
                    reset: () => { if(confirm("¿Resetear?")) { setContent(DEFAULT_CONTENT); localStorage.removeItem('site_content_minimal'); }}
                }}>
                    {children}
                </ContentContext.Provider>
            );
        };
        const useContent = () => useContext(ContentContext);

        // --- COMPONENTS ---
        const Reveal = ({ children, className = "", delay = 0 }) => {
            const ref = useRef(null);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target);
                    }
                }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            return <div ref={ref} className={`reveal ${className}`} style={{ transitionDelay: `${delay}ms` }}>{children}</div>;
        };

        const FloatingNav = ({ onOpenAdmin }) => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileOpen, setMobileOpen] = useState(false);

            useEffect(() => {
                const fn = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', fn);
                return () => window.removeEventListener('scroll', fn);
            }, []);

            const links = [
                { name: 'Nosotros', href: '#about' },
                { name: 'Servicios', href: '#services' },
                { name: 'Pilates', href: '#pilates' },
                { name: 'Contacto', href: '#contact' }
            ];

            return (
                <>
                    {/* Desktop "Pill" Navigation */}
                    <nav className={`fixed top-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-500 hidden md:flex items-center gap-1 ${
                        scrolled ? 'bg-white/90 backdrop-blur-md shadow-sm border border-stone-200/50 py-2 px-3 rounded-full' : 'py-4'
                    }`}>
                        <a href="#home" className="mr-4 pl-3 font-serif font-bold text-lg tracking-tight hover:text-brand-green transition-colors">
                            NP<span className="text-brand-green">.</span>
                        </a>
                        
                        <div className="flex items-center bg-stone-100/50 rounded-full px-1">
                            {links.map(l => (
                                <a key={l.name} href={l.href} className="px-5 py-2 text-sm font-medium text-stone-600 hover:text-stone-900 transition-colors rounded-full hover:bg-white">
                                    {l.name}
                                </a>
                            ))}
                        </div>

                        <button onClick={onOpenAdmin} className="ml-2 p-2 text-stone-400 hover:text-stone-900 transition-colors">
                            <Settings size={18} strokeWidth={1.5} />
                        </button>
                    </nav>

                    {/* Mobile Navigation */}
                    <div className="md:hidden fixed top-0 w-full z-50 p-4 flex justify-between items-center pointer-events-none">
                         <a href="#home" className="pointer-events-auto font-serif font-bold text-xl bg-white/80 backdrop-blur px-4 py-2 rounded-full shadow-sm">
                            NP<span className="text-brand-green">.</span>
                        </a>
                        <button onClick={() => setMobileOpen(true)} className="pointer-events-auto p-3 bg-white shadow-lg rounded-full text-stone-900">
                            <Menu size={20} strokeWidth={1.5}/>
                        </button>
                    </div>

                    {/* Mobile Menu Overlay */}
                    {mobileOpen && (
                        <div className="fixed inset-0 bg-white z-[60] flex flex-col items-center justify-center animate-fade-up">
                            <button onClick={() => setMobileOpen(false)} className="absolute top-6 right-6 p-4 text-stone-500 hover:text-stone-900">
                                <X size={32} strokeWidth={1} />
                            </button>
                            <nav className="flex flex-col gap-8 text-center">
                                {links.map(l => (
                                    <a key={l.name} href={l.href} onClick={() => setMobileOpen(false)} className="font-serif text-4xl text-stone-800 hover:text-brand-green hover:italic transition-all">
                                        {l.name}
                                    </a>
                                ))}
                                <button onClick={() => {setMobileOpen(false); onOpenAdmin();}} className="mt-8 text-sm text-stone-400 uppercase tracking-widest">
                                    Admin Access
                                </button>
                            </nav>
                        </div>
                    )}
                </>
            );
        };

        const AdminModal = ({ isOpen, onClose }) => {
            const { content, updateContent, isAdmin, login, logout, reset } = useContent();
            const [pass, setPass] = useState("");
            const [tab, setTab] = useState('hero');

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] bg-stone-900/40 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-scale-in">
                        <div className="p-4 border-b flex justify-between items-center bg-stone-50">
                            <h3 className="font-serif italic font-medium">Editor de Contenido</h3>
                            <button onClick={onClose}><X size={20} className="text-stone-400"/></button>
                        </div>
                        <div className="p-6">
                            {!isAdmin ? (
                                <div className="space-y-4">
                                    <input type="password" placeholder="Contraseña..." className="w-full p-3 bg-stone-50 rounded-lg outline-none focus:ring-1 focus:ring-stone-300" 
                                        value={pass} onChange={e => setPass(e.target.value)}/>
                                    <button onClick={() => login(pass) || alert("Error")} className="w-full bg-stone-900 text-white py-3 rounded-lg">Acceder</button>
                                </div>
                            ) : (
                                <div>
                                    <div className="flex gap-2 mb-6 overflow-x-auto pb-2">
                                        {['hero','contact','pilates'].map(t => (
                                            <button key={t} onClick={() => setTab(t)} className={`px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${tab===t ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-500'}`}>{t}</button>
                                        ))}
                                    </div>
                                    <div className="space-y-4 max-h-[50vh] overflow-y-auto custom-scrollbar pr-2">
                                        {Object.entries(content[tab]).map(([k,v]) => (
                                            <div key={k}>
                                                <label className="text-[10px] uppercase font-bold text-stone-400 mb-1 block">{k}</label>
                                                <textarea value={v} onChange={e=>updateContent(tab,k,e.target.value)} className="w-full p-2 bg-stone-50 border border-stone-100 rounded text-sm focus:border-stone-400 outline-none" rows={3}/>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-6 pt-4 border-t flex justify-between">
                                        <button onClick={reset} className="text-red-400 text-xs hover:text-red-600"><RotateCcw size={14}/></button>
                                        <button onClick={logout} className="text-stone-400 text-xs hover:text-stone-900 flex items-center gap-1">Salir <LogOut size={14}/></button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const { content } = useContent();
            const [adminOpen, setAdminOpen] = useState(false);

            return (
                <div className="min-h-screen selection:bg-brand-green/20 selection:text-brand-green">
                    <FloatingNav onOpenAdmin={() => setAdminOpen(true)} />
                    <AdminModal isOpen={adminOpen} onClose={() => setAdminOpen(false)} />

                    {/* HERO SPLIT SCREEN */}
                    <section id="home" className="min-h-screen pt-24 md:pt-0 flex flex-col md:flex-row">
                        <div className="flex-1 flex items-center justify-center p-6 md:p-20 order-2 md:order-1">
                            <Reveal className="max-w-xl">
                                <div className="flex items-center gap-3 mb-8">
                                    <span className="h-px w-12 bg-brand-green"></span>
                                    <span className="text-xs font-bold tracking-widest uppercase text-stone-500">{content.hero.badge}</span>
                                </div>
                                <h1 className="font-serif text-5xl md:text-7xl lg:text-8xl leading-[0.9] text-stone-900 mb-8">
                                    {content.hero.titleLine1} <br/>
                                    <span className="italic text-stone-400">{content.hero.titleLine2}</span>
                                </h1>
                                <p className="text-lg text-stone-500 leading-relaxed mb-10 max-w-md font-light">
                                    {content.hero.description}
                                </p>
                                <div className="flex gap-6 items-center">
                                    <a href="#contact" className="bg-stone-900 text-white px-8 py-4 rounded-full text-sm font-medium hover:bg-brand-green transition-colors duration-500 shadow-xl shadow-stone-200">
                                        {content.hero.buttonPrimary}
                                    </a>
                                    <a href="#about" className="text-sm font-medium text-stone-500 hover:text-stone-900 flex items-center gap-2 group">
                                        Conócenos <ArrowRight size={16} className="group-hover:translate-x-1 transition-transform"/>
                                    </a>
                                </div>
                            </Reveal>
                        </div>
                        <div className="flex-1 h-[50vh] md:h-screen relative p-4 md:p-6 order-1 md:order-2">
                            <div className="w-full h-full rounded-3xl overflow-hidden relative shadow-2xl">
                                <img src="assets/Portada Clinica.png" className="w-full h-full object-cover transition-transform duration-[2s] hover:scale-105" />
                                <div className="absolute inset-0 bg-stone-900/10 hover:bg-transparent transition-colors duration-700"></div>
                            </div>
                        </div>
                    </section>

                    {/* ABOUT: MINIMAL TEXT */}
                    <section id="about" className="py-32 px-6">
                        <div className="max-w-4xl mx-auto text-center">
                            <Reveal>
                                <h2 className="font-serif text-3xl md:text-5xl text-stone-800 leading-tight mb-8">
                                    "Rechazamos los tratamientos estandarizados. Creemos en la <span className="text-brand-green italic">atención personalizada</span> y el contacto humano."
                                </h2>
                                <div className="flex items-center justify-center gap-4">
                                    <div className="w-12 h-12 rounded-full overflow-hidden bg-stone-200">
                                         <img src="assets/Jose Diego.png" className="w-full h-full object-cover"/>
                                    </div>
                                    <div className="text-left">
                                        <p className="text-sm font-bold text-stone-900">José Diego Frutos</p>
                                        <p className="text-xs text-stone-500 uppercase tracking-wider">Director</p>
                                    </div>
                                </div>
                            </Reveal>
                        </div>
                    </section>

                    {/* SERVICES: FLAT CARDS */}
                    <section id="services" className="py-32 bg-white px-6">
                        <div className="max-w-7xl mx-auto">
                            <Reveal className="mb-20 flex justify-between items-end border-b border-stone-100 pb-8">
                                <div>
                                    <p className="text-xs font-bold tracking-widest text-stone-400 mb-2 uppercase">Nuestra Práctica</p>
                                    <h3 className="font-serif text-4xl text-stone-900">Servicios Clínicos</h3>
                                </div>
                                <ArrowUpRight className="text-stone-300 w-12 h-12 hidden md:block" strokeWidth={1}/>
                            </Reveal>
                            
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-x-12 gap-y-16">
                                {SERVICES_LIST.map((s, i) => (
                                    <Reveal key={i} delay={i*100}>
                                        <div className="group cursor-default">
                                            <div className="mb-6 text-brand-green opacity-80 group-hover:opacity-100 transition-opacity">
                                                <s.icon size={32} strokeWidth={1.2} />
                                            </div>
                                            <h4 className="text-xl font-medium text-stone-900 mb-3 group-hover:text-brand-green transition-colors">{s.title}</h4>
                                            <p className="text-stone-500 font-light leading-relaxed">{s.desc}</p>
                                            <div className="mt-6 w-8 h-px bg-stone-200 group-hover:w-full group-hover:bg-brand-green transition-all duration-700"></div>
                                        </div>
                                    </Reveal>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* PILATES: DARK & CLEAN */}
                    <section id="pilates" className="py-32 bg-brand-dark text-stone-100 px-6 relative overflow-hidden">
                        <div className="max-w-7xl mx-auto grid lg:grid-cols-2 gap-20 items-center relative z-10">
                            <Reveal>
                                <span className="text-brand-green font-serif italic text-xl mb-4 block">Studio</span>
                                <h3 className="font-serif text-5xl md:text-6xl mb-8 leading-none">{content.pilates.title}</h3>
                                <p className="text-stone-400 text-lg font-light mb-12 max-w-md">{content.pilates.description}</p>
                                
                                <div className="space-y-6">
                                    {[
                                        { label: "Individual", price: content.pilates.priceIndividual },
                                        { label: "Pareja", price: content.pilates.pricePair },
                                        { label: "Grupos (max 4)", price: content.pilates.priceGroup }
                                    ].map((p, idx) => (
                                        <div key={idx} className="flex justify-between items-center border-b border-white/10 pb-4 group hover:border-brand-green/50 transition-colors cursor-default">
                                            <span className="font-medium text-lg group-hover:pl-2 transition-all">{p.label}</span>
                                            <span className="font-serif italic text-stone-500">{p.price}</span>
                                        </div>
                                    ))}
                                </div>
                            </Reveal>
                            <Reveal delay={200} className="relative h-[600px] hidden lg:block">
                                <div className="absolute inset-0 bg-stone-800 rounded-none overflow-hidden">
                                    <img src="assets/interior.png" className="w-full h-full object-cover opacity-60 grayscale hover:grayscale-0 transition-all duration-1000"/>
                                </div>
                            </Reveal>
                        </div>
                    </section>

                    {/* GALLERY: MASONRY STYLE */}
                    <section className="py-32 px-6">
                        <div className="max-w-7xl mx-auto">
                             <Reveal className="mb-16">
                                <h3 className="font-serif text-4xl text-stone-900 text-center">Espacios</h3>
                            </Reveal>
                            <div className="grid md:grid-cols-3 gap-4 h-[60vh] min-h-[500px]">
                                {GALLERY_ITEMS.map((item, i) => (
                                    <div key={i} className={`relative overflow-hidden group ${i===0 ? 'md:col-span-2 md:row-span-2' : ''}`}>
                                        <img src={item.img} className="w-full h-full object-cover transition-transform duration-[1.5s] group-hover:scale-105" />
                                        <div className="absolute inset-0 bg-white/0 group-hover:bg-white/10 transition-colors p-8 flex flex-col justify-end opacity-0 group-hover:opacity-100 duration-500">
                                            <p className="text-white font-serif italic text-2xl drop-shadow-md">{item.title}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* CONTACT: CLEAN */}
                    <section id="contact" className="py-32 bg-stone-100 px-6">
                        <div className="max-w-5xl mx-auto bg-white p-8 md:p-16 shadow-xl shadow-stone-200/50">
                            <Reveal>
                                <div className="grid md:grid-cols-2 gap-16">
                                    <div>
                                        <h3 className="font-serif text-3xl mb-8">Contacto</h3>
                                        <div className="space-y-8">
                                            <div>
                                                <label className="text-xs font-bold text-stone-400 uppercase tracking-widest">Visítanos</label>
                                                <p className="text-lg text-stone-800 mt-1 font-light">{content.contact.address}</p>
                                                <p className="text-lg text-stone-800 font-light">{content.contact.city}</p>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-stone-400 uppercase tracking-widest">Llámanos</label>
                                                <p className="text-lg text-stone-800 mt-1 font-light hover:text-brand-green transition-colors">
                                                    <a href={`tel:${content.contact.phone.replace(/\s/g,'')}`}>{content.contact.phone}</a>
                                                </p>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-stone-400 uppercase tracking-widest">Escríbenos</label>
                                                <p className="text-lg text-stone-800 mt-1 font-light break-all hover:text-brand-green transition-colors">
                                                    <a href={`mailto:${content.contact.email}`}>{content.contact.email}</a>
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="h-[300px] md:h-auto bg-stone-100 relative grayscale hover:grayscale-0 transition-all duration-700">
                                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3145.897350785168!2d-1.1627!3d37.9315!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd63806295555555%3A0x123456789!2sAv.%20de%20Burgos%2C%2030120%20El%20Palmar%2C%20Murcia!5e0!3m2!1ses!2ses!4v1234567890" 
                                        className="absolute inset-0 w-full h-full border-0" loading="lazy"></iframe>
                                    </div>
                                </div>
                            </Reveal>
                        </div>
                    </section>

                    <footer className="py-12 text-center text-stone-400 text-xs uppercase tracking-widest bg-stone-50">
